{% extends "base.html" %}

{% load static %}
{% block title %}Edit Comment{% endblock title %}

{% block content %}
<!-- edit_comment.html -->

<div class="container-fluid text-center">
    <h2>Edit Comment</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="me-4 btn btn-light">Save Changes</button>
        <a href="{% url 'photography_blog' %}" class="text-decoration-none btn btn-primary">Cancel</a>
    </form>
 {% endblock content %}
